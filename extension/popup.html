<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 13px 'Segoe UI', system-ui, sans-serif; background: #fafafa; color: #111; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 15px; }
    h1 img { width: 20px; height: 20px; border-radius: 4px; }
    h1 small { margin-left: auto; font-weight: 400; color: #777; }
    label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #555; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; padding: 8px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; background: #111; color: #fff; }
    button.ghost { background: #e5e5e5; color: #111; }
    .status { display: none; margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 12px; }
    .ok { display: block; background: #dcfce7; color: #166534; }
    .err { display: block; background: #fee2e2; color: #991b1b; }
    p { margin: 10px 0 0; font-size: 11px; line-height: 1.45; color: #666; }
  </style>
</head>
<body>
  <h1><img src="icon.png" alt=""> PEPPACORP Monitor <small id="ver"></small></h1>
  <button id="silence" style="display:none;width:100%;margin-bottom:12px;background:#dc2626">🔇 Silenciar alarme</button>
  <label for="server">Endereço do PEPPACORP</label>
  <input id="server" placeholder="Endereço que aparece em Conectar Robô">
  <label for="key">Chave de ingestão</label>
  <input id="key" type="password" placeholder="Configurações → Chave de ingestão do monitor">
  <div class="row">
    <button id="save">Salvar</button>
    <button id="test" class="ghost">Testar conexão</button>
  </div>
  <div id="status" class="status"></div>
  <p>Mais fácil: abra o PEPPACORP → <b>Conectar Robô</b> e clique em “Conectar extensão”.
    Depois cadastre o link da compra em Monitoramento e deixe a página de acompanhamento do Comprasnet aberta.</p>
  <script src="popup.js"></script>
</body>
</html>
